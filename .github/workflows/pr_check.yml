name: check-pr

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
    branches:
      - main

jobs:
  lint:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit==4.1.0
      - name: Initialize pre-commit
        run: pre-commit install
      - name: Run pre-commit
        run: pre-commit run --all-files
  pytest:
    name: Run PyTest
    runs-on: ubuntu-latest
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install poetry
        run: pip install "poetry==2.1.1"
      - name: Install deps
        run: |
          poetry install --with test
      - name: PyTest
        run: |
          pytest \
            -ra \
            --strict-markers \
            --strict-config \
            --maxfail=1 \
  coverage:
    name: Coveralls Coverage
    runs-on: ubuntu-latest
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install poetry
        run: pip install "poetry==2.1.1"
      - name: Install deps | Gen coverage
        run: |
          poetry install --with test
          coverage run --source=spoe_forge -m pytest tests/
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
