[test-engine]
spoe-agent test-agent
    option var-prefix  test
    timeout hello      1s
    timeout processing 1s
    timeout idle       5s

    messages test-ping test-pong

    use-backend test-agent

spoe-message test-ping
    acl is_favicon path_beg /favicon
    event on-frontend-http-request if !is_favicon

spoe-message test-pong
    acl is_favicon path_beg /favicon
    args test_arg=var(req.test.spoe_arg)
    event on-backend-http-request if !is_favicon
