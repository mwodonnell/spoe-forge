[tool.poetry]
name = "spoe-forge"
version = "0.0.1"
description = "Pure Python SPOE Agents"
authors = [
    "Mike O'Donnell <mike@devferret.com>",
]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.1.0"
ruff = "0.14.2"

[tool.poetry.group.test.dependencies]
pytest = "9.0.1"
pytest-asyncio = "1.3.0"
coveralls = "4.0.2"
coverage = "7.13.0"

[pytest]
testpaths = "tests"
asyncio_mode = "auto"
addopts = [
    "--verbose",
    "--cov=spoe_forge",
    "--cov-report=term-missing",
    "--cov-report=html"
]
